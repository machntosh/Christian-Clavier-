name: CI

# Valide le projet SANS Mac local :
#  - job `sharedcore` : compile et teste la logique pure (swift test) sur Linux,
#    rapide et gratuit. C'est le cœur du moteur de correction.
#  - job `ios-build`  : sur un runner macOS hébergé par GitHub, génère le projet
#    Xcode (xcodegen) et compile l'app + l'extension pour le simulateur.
#
# Aucun Mac requis de ton côté : tout tourne sur l'infra GitHub.

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  sharedcore:
    name: SharedCore (swift test, Linux)
    runs-on: ubuntu-latest
    container: swift:5.9
    steps:
      - uses: actions/checkout@v4
      - name: swift build
        run: swift build
      - name: swift test
        run: swift test

  ios-build:
    name: App + Extension (build simulateur, macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Installer XcodeGen
        run: brew install xcodegen
      - name: Générer le projet Xcode
        run: xcodegen generate
      - name: Build (simulateur, sans signature)
        run: |
          xcodebuild build \
            -project ClavierFR.xcodeproj \
            -scheme ClavierFR \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
